<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}QDesk{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f7f7f5;
            color: #171717;
        }

        .token {
            font-family:
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;
            letter-spacing: -0.04em;
        }

        .q-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;

            padding: 0.7rem 1rem;

            background: #171717;
            color: white;

            border: 1px solid #171717;
            border-radius: 5px;

            font-size: 0.875rem;
            font-weight: 600;

            transition:
                background 0.15s ease,
                border-color 0.15s ease;
        }

        .q-button:hover {
            background: #d94f30;
            border-color: #d94f30;
        }

        .q-button-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 0.7rem 1rem;

            background: white;
            color: #171717;

            border: 1px solid #d8d8d2;
            border-radius: 5px;

            font-size: 0.875rem;
            font-weight: 600;

            transition:
                border-color 0.15s ease,
                background 0.15s ease;
        }

        .q-button-secondary:hover {
            border-color: #171717;
            background: #f4f4f1;
        }

        .q-input {
            width: 100%;

            padding: 0.75rem 0.8rem;

            background: white;

            border: 1px solid #d8d8d2;
            border-radius: 5px;

            outline: none;

            font-size: 0.95rem;
        }

        .q-input:focus {
            border-color: #171717;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 0.75rem 0.8rem;

            background: white;

            border: 1px solid #d8d8d2;
            border-radius: 5px;

            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #171717;
        }

        input[type="file"] {
            padding: 0.55rem;
        }

        .q-label {
            display: block;
            margin-bottom: 0.4rem;

            font-size: 0.8rem;
            font-weight: 600;

            color: #555550;
        }

        .q-divider {
            border-top: 1px solid #deded8;
        }

        @media print {

            .no-print {
                display: none !important;
            }

            body {
                background: white;
            }

        }

    </style>

    {% block extra_head %}{% endblock %}

</head>


<body class="min-h-screen">

    <nav class="no-print border-b border-[#deded8] bg-[#f7f7f5]">

        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">

            <a
                href="{% url 'home' %}"
                class="font-bold tracking-tight text-lg"
            >
                QDesk
            </a>


            <div class="flex items-center gap-6">

                <a
                    href="{% url 'organizations:list' %}"
                    class="text-sm text-[#555550] hover:text-[#171717]"
                >
                    Organizations
                </a>

            </div>

        </div>

    </nav>


    {% block content %}
    {% endblock %}

</body>

</html>
