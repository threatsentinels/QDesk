<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}QDesk{% endblock %}</title>

    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f7f7;
            color: #222;
            font-size: 15px;
            line-height: 1.5;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }


        /* NAVBAR */

        .topbar {
            height: 64px;
            background: white;
            border-bottom: 1px solid #ddd;
        }

        .topbar-inner {
            width: min(1100px, calc(100% - 32px));
            height: 100%;
            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            color: #111;
            font-size: 21px;
            font-weight: 700;
            text-decoration: none;
        }

        .brand:hover {
            text-decoration: none;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .nav a {
            color: #555;
            font-size: 14px;
        }

        .nav a:hover {
            color: #111;
        }


        /* GENERAL PAGE */

        .page {
            width: min(1100px, calc(100% - 32px));
            margin: 0 auto;
            padding: 32px 0 50px;
        }

        .container {
            width: min(1100px, calc(100% - 32px));
            margin: 0 auto;
        }


        /* PAGE HEADER */

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 20px;
        }

        .breadcrumb {
            display: flex;
            gap: 8px;
            color: #777;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .page-title-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-title {
            margin: 0;
            font-size: 25px;
            font-weight: 600;
            color: #111;
        }

        .location {
            margin: 6px 0 0;
            color: #777;
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }


        /* BUTTONS */

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 38px;
            padding: 0 14px;

            border: 1px solid #ccc;
            border-radius: 4px;

            background: white;
            color: #222;

            font-size: 14px;
            cursor: pointer;

            text-decoration: none;
        }

        .btn:hover {
            background: #f3f3f3;
            text-decoration: none;
        }

        .btn-primary {
            background: #2563eb;
            border-color: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
            color: white;
        }

        .btn-danger {
            background: #dc2626;
            border-color: #dc2626;
            color: white;
        }

        .btn-danger:hover {
            background: #b91c1c;
            border-color: #b91c1c;
        }

        .btn-block {
            width: 100%;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }


        /* STATUS */

        .status {
            display: inline-block;

            padding: 2px 8px;

            border: 1px solid #ddd;
            border-radius: 4px;

            font-size: 12px;
        }

        .status-active {
            color: #166534;
            background: #f0fdf4;
            border-color: #bbf7d0;
        }

        .status-inactive {
            color: #666;
            background: #f5f5f5;
        }


        /* META */

        .meta {
            display: flex;
            flex-wrap: wrap;

            gap: 30px;

            padding: 12px 0;
            margin-bottom: 20px;

            border-top: 1px solid #ddd;
            border-bottom: 1px solid #ddd;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 7px;

            color: #777;
            font-size: 13px;
        }

        .meta-item strong {
            color: #222;
        }


        /* CARDS */

        .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .card-header {
            padding: 14px 16px;
            border-bottom: 1px solid #ddd;

            font-size: 15px;
            font-weight: 600;
        }


        /* DASHBOARD */

        .dashboard-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 280px;
            gap: 20px;
            align-items: start;
        }

        .main-column {
            min-width: 0;
        }


        /* SERVING */

        .serving {
            min-height: 280px;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;
            padding: 30px;
        }

        .serving-label {
            color: #777;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .token-number {
            color: #111;
            font-size: 52px;
            line-height: 1.1;
            font-weight: 600;
        }

        .counter {
            margin-top: 8px;
            color: #777;
            font-size: 14px;
        }


        /* QUEUE */

        .queue {
            margin-top: 20px;
        }

        .queue-row {
            min-height: 54px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;
            padding: 0 16px;

            border-bottom: 1px solid #eee;
        }

        .queue-row:last-child {
            border-bottom: 0;
        }

        .queue-token {
            display: inline-block;
            min-width: 75px;

            font-weight: 600;
        }

        .queue-status {
            color: #777;
            font-size: 13px;
        }

        .queue-empty {
            padding: 40px 20px;
            text-align: center;
            color: #777;
        }


        /* SIDEBAR */

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar-card {
            width: 100%;
        }

        .control {
            padding: 16px;
            border-bottom: 1px solid #eee;
        }

        .control:last-child {
            border-bottom: 0;
        }

        .control-title {
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        .control-note {
            margin: 8px 0 0;
            color: #777;
            font-size: 12px;
        }


        /* STATS */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
        }

        .stat {
            padding: 14px 16px;
            border-right: 1px solid #ddd;
        }

        .stat:last-child {
            border-right: 0;
        }

        .stat-label {
            color: #777;
            font-size: 12px;
        }

        .stat-value {
            margin-top: 3px;
            font-size: 20px;
            font-weight: 600;
        }


        /* HOME PAGE */

        .home {
            padding: 55px 0;
        }

        .home-intro {
            max-width: 700px;
        }

        .home-kicker {
            margin: 0 0 12px;
            color: #2563eb;
            font-size: 14px;
        }

        .home-title {
            margin: 0;
            max-width: 650px;

            font-size: 46px;
            line-height: 1.1;
            font-weight: 600;
            color: #111;
        }

        .home-description {
            max-width: 650px;
            margin: 20px 0;

            color: #555;
            font-size: 17px;
        }

        .home-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .steps {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;

            margin-top: 60px;
        }

        .step {
            padding: 20px;

            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .step-number {
            color: #2563eb;
            font-size: 13px;
            font-weight: 600;
        }

        .step h2 {
            margin: 12px 0 8px;
            font-size: 20px;
        }

        .step p {
            margin: 0;
            color: #666;
        }


        /* FORMS */

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 9px 10px;

            border: 1px solid #ccc;
            border-radius: 4px;

            background: white;
            color: #222;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }
        .organization-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.organization-card {
    overflow: hidden;
}

.organization-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 18px 20px;
}

.organization-name {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
}

.organization-events {
    margin: 3px 0 0;
    color: #777;
    font-size: 13px;
}

.organization-logo {
    width: 42px;
    height: 42px;
    object-fit: cover;
    border: 1px solid #ddd;
    border-radius: 4px;
}

.organization-events-list {
    border-top: 1px solid #ddd;
}

.event-row {
    min-height: 62px;
    padding: 0 20px;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;

    color: #222;
    border-bottom: 1px solid #eee;
}

.event-row:last-child {
    border-bottom: 0;
}

.event-row:hover {
    background: #fafafa;
    text-decoration: none;
}

.event-name {
    font-weight: 600;
}

.event-location {
    margin-top: 2px;
    color: #777;
    font-size: 12px;
}

.event-right {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
}

.event-active {
    color: #166534;
    font-size: 12px;
}

.event-inactive {
    color: #888;
    font-size: 12px;
}

.event-open {
    color: #2563eb;
    font-size: 13px;
    font-weight: 600;
}

.organization-empty {
    padding: 20px;
    color: #777;
    font-size: 13px;
}

.empty-state {
    padding: 50px 25px;
    text-align: center;
}

.empty-state h2 {
    margin: 0 0 8px;
    font-size: 20px;
}

.empty-state p {
    margin: 0 0 18px;
    color: #777;
}

@media (max-width: 600px) {
    .organization-header {
        padding: 16px;
    }

    .event-row {
        padding: 14px 16px;
    }

    .event-right {
        gap: 8px;
    }

    .event-active,
    .event-inactive {
        display: none;
    }
}


        /* MOBILE */

        @media (max-width: 800px) {

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .stat:nth-child(2) {
                border-right: 0;
            }

            .stat:nth-child(-n+2) {
                border-bottom: 1px solid #ddd;
            }

            .steps {
                grid-template-columns: 1fr;
            }

        }


        @media (max-width: 600px) {

            .topbar-inner,
            .page,
            .container {
                width: min(100% - 24px, 1100px);
            }

            .page-header {
                flex-direction: column;
            }

            .header-actions {
                width: 100%;
            }

            .header-actions .btn {
                flex: 1;
            }

            .home {
                padding: 35px 0;
            }

            .home-title {
                font-size: 36px;
            }

            .home-actions {
                flex-direction: column;
            }

            .token-number {
                font-size: 42px;
            }

        }


        /* PRINT */

        @media print {

            .no-print {
                display: none !important;
            }

            body {
                background: white;
            }

        }

    </style>

    {% block extra_head %}{% endblock %}

</head>


<body>

    <nav class="topbar no-print">

        <div class="topbar-inner">

            <a
                href="{% url 'home' %}"
                class="brand"
            >
                QDesk
            </a>

            <div class="nav">

                <a href="{% url 'organizations:list' %}">
                    Organizations
                </a>

                <span style="color: #777;">
                    Queue System
                </span>

            </div>

        </div>

    </nav>


    {% block content %}
    {% endblock %}


</body>

</html>
