<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ event.name }} — QDesk</title>

    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background: #f7f7f7;
            color: #222;
        }


        .display-header {
            padding: 22px 32px;

            background: white;

            border-bottom: 1px solid #ddd;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }


        .brand {
            font-size: 20px;
            font-weight: 700;
        }


        .organization {
            margin-top: 2px;

            color: #777;
            font-size: 13px;
        }


        .event-info {
            text-align: right;
        }


        .event-name {
            font-weight: 600;
        }


        .event-location {
            margin-top: 2px;

            color: #777;
            font-size: 13px;
        }


        .display-main {
            width: min(1100px, calc(100% - 40px));

            margin: 0 auto;

            padding: 55px 0;
        }


        #display {
            background: white;

            border: 1px solid #ddd;
        }


        .public-current {
            min-height: 420px;

            padding: 50px 30px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;
        }


        .public-label {
            margin: 0;

            color: #777;

            font-size: 13px;
            font-weight: 600;

            text-transform: uppercase;
            letter-spacing: 0.12em;
        }


        .public-token {
            margin-top: 20px;

            color: #111;

            font-size: clamp(70px, 13vw, 150px);
            line-height: 1;

            font-weight: 700;
        }


        .public-counter {
            margin: 25px 0 0;

            color: #555;

            font-size: 22px;
        }


        .public-counter strong {
            color: #111;
        }


        .public-message {
            margin-top: 20px;

            font-size: 28px;
            font-weight: 600;
        }


        .public-waiting {
            padding: 22px 30px;

            border-top: 1px solid #ddd;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 30px;
        }


        .public-help {
            margin: 4px 0 0;

            color: #777;
            font-size: 13px;
        }


        .public-token-list {
            display: flex;
            flex-wrap: wrap;

            justify-content: flex-end;

            gap: 10px;
        }


        .public-token-list span {
            padding: 7px 11px;

            border: 1px solid #ccc;
            border-radius: 4px;

            background: white;

            font-weight: 600;
        }


        @media (max-width: 650px) {

            .display-header {
                padding: 18px;
            }

            .display-main {
                width: calc(100% - 24px);
                padding: 25px 0;
            }

            .public-current {
                min-height: 350px;
                padding: 35px 20px;
            }

            .public-message {
                font-size: 22px;
            }

            .public-counter {
                font-size: 18px;
            }

            .public-waiting {
                align-items: flex-start;
                flex-direction: column;
                padding: 20px;
            }

            .public-token-list {
                justify-content: flex-start;
            }

            .event-info {
                display: none;
            }

        }

    </style>

</head>


<body>

    <header class="display-header">

        <div>

            <div class="brand">
                QDesk
            </div>

            <div class="organization">
                {{ event.organization.name }}
            </div>

        </div>


        <div class="event-info">

            <div class="event-name">
                {{ event.name }}
            </div>

            {% if event.location %}

                <div class="event-location">
                    {{ event.location }}
                </div>

            {% endif %}

        </div>

    </header>


    <main class="display-main">

        {% include "events/partials/display.html" %}

    </main>

</body>

</html>
