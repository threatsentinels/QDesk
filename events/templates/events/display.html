<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ event.name }} — QDesk Display</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

</head>


<body class="bg-[#f7f7f5] text-[#171717] min-h-screen">


    <header class="border-b border-[#deded8]">

        <div class="max-w-7xl mx-auto px-8 py-6">

            <div class="flex items-center justify-between">

                <div>

                    <p class="font-bold text-xl tracking-tight">
                        QDesk
                    </p>

                    <p class="text-sm text-[#777770] mt-1">
                        {{ event.organization.name }}
                    </p>

                </div>


                <div class="text-right">

                    <p class="font-semibold">
                        {{ event.name }}
                    </p>

                    {% if event.location %}

                        <p class="text-sm text-[#777770]">
                            {{ event.location }}
                        </p>

                    {% endif %}

                </div>

            </div>

        </div>

    </header>


    <main class="max-w-7xl mx-auto px-8 py-12">


        {% include "events/partials/display.html" %}


    </main>


</body>

</html>
