<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {{ event.name }} — {{ event.token_prefix }}-{{ token.number|stringformat:"03d" }}
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background: #eee;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        .ticket {

            width: 80mm;
            min-height: 55mm;

            margin: 20px auto;

            padding: 10mm;

            background: white;

            text-align: center;

        }


        .organization {

            font-size: 12px;

            color: #555;

            margin-bottom: 5px;

        }


        .event {

            font-size: 14px;

            font-weight: 700;

        }


        .token {

            margin-top: 12px;

            font-family:
                "Courier New",
                monospace;

            font-size: 38px;

            font-weight: 700;

            letter-spacing: -2px;

        }


        .message {

            margin-top: 10px;

            font-size: 11px;

            color: #666;

        }


        .time {

            margin-top: 12px;

            padding-top: 8px;

            border-top: 1px dashed #bbb;

            font-size: 10px;

            color: #777;

        }


        .print-button {

            display: block;

            margin: 20px auto;

            padding: 10px 18px;

            border: 0;

            background: #171717;

            color: white;

            cursor: pointer;

        }


        @media print {

            @page {

                size: 80mm auto;

                margin: 0;

            }


            body {

                background: white;

            }


            .ticket {

                width: 80mm;

                margin: 0;

                min-height: auto;

            }


            .print-button {

                display: none;

            }

        }

    </style>

</head>


<body>


    <button
        class="print-button"
        onclick="window.print()"
    >
        Print token
    </button>


    <div class="ticket">

        <div class="organization">
            {{ event.organization.name }}
        </div>


        <div class="event">
            {{ event.name }}
        </div>


        <div class="token">

            {{ event.token_prefix }}-{{ token.number|stringformat:"03d" }}

        </div>


        <div class="message">
            Please keep this token until your number is called.
        </div>


        <div class="time">

            {{ token.generated_at|date:"M d, Y · H:i" }}

        </div>

    </div>


</body>

</html>
